[package]
name = "th_pipe"
description = "TumblePipe's pipeline in Rust: URIs, storage, the config database, departments, versions, review media discovery, entity create and retire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
th_playlist.workspace = true
th_edit.workspace = true
serde.workspace = true
# Key order is the config's: pool order is pipeline order, and a rewrite
# must not reorder what Python wrote.
# float_roundtrip: live.json's started_at reads back to the bit Python wrote.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror.workspace = true
tempfile.workspace = true
chrono.workspace = true

[features]
# `th_pipe::testing`: a minimal project on disk, for other crates' tests.
testing = []

[dev-dependencies]
proptest.workspace = true
