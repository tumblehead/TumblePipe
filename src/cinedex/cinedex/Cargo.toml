[package]
name = "cinedex"
description = "Cinedex, the TumblePipe editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cinedex"
path = "src/main.rs"

[dependencies]
th_media.workspace = true
primer.workspace = true
bytemuck.workspace = true
half.workspace = true
futures = "0.3"
th_playlist.workspace = true
th_edit.workspace = true
th_pipe.workspace = true
ocio-rs.workspace = true
# Render Edit's frames, and its render.json.
png = "0.18"
serde_json.workspace = true
# The board: how long ago a workfile was saved.
chrono.workspace = true
# Export movie's mix, in a temporary folder while it encodes.
tempfile.workspace = true
# Sound out. On by default; Linux builds need ALSA headers (libasound2-dev)
# and the binary then links libasound.so.2.
cpal = { version = "0.18", optional = true }

# The native menu bar (Primer's `os` feature) on macOS only, where it is the
# global bar at the top of the screen. On Windows the native bar is a white
# Win32 menu that ignores the theme, and on Linux it would link GTK; without
# the feature Primer draws the menu inside the window in the player's theme.
[target.'cfg(target_os = "macos")'.dependencies]
primer = { workspace = true, features = ["os"] }
# A Live view orders the editor's windows in front (`src/raise.rs`). The
# objc2 winit already links.
objc2 = "0.5.2"

# A Live view raises the editor's X11 windows (`src/raise.rs`): x11rb's own
# connection, no libX11 to link. Already in the tree through winit.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

[features]
default = ["sound"]
sound = ["dep:cpal"]

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
exr.workspace = true
# examples/raise_check.rs: a bare window to raise (Primer's winit).
winit = "0.30.13"
