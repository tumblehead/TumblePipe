# Cinedex, TumblePipe's editor: plays shots back to back from TumblePipe's review media
# (playblasts, dailies, EXR renders), frame-accurately. It links the FFmpeg
# that .ci/build_ffmpeg.py builds; .ci/build_player.py (the build-player
# prepack script) ships those shared libraries beside the executable in
# bin/<platform>/. See docs/development.md, "Cinedex, the editor".
#
# `media` holds every decoding rule (frame index, seek-and-decode, EXR channel
# selection, the decoded-frame buffer) and links no GUI, so frame accuracy is
# testable headless; `cinedex` is the Primer app on top.
[workspace]
resolver = "3"
#
# `cleanup` (th_cleanup) is the Clean Up Project tool's logic, a port of
# tumblepipe.cleanup that links no FFmpeg, OCIO or GUI.
#
# `window` (th_window) puts an app's icon on its windows and finds them on
# X11, for Cinedex and Clean Up alike; it links no FFmpeg either.
members = ["cinedex", "cleanup", "cleanup-app", "edit", "ffmpeg-sys", "media", "pipe", "playlist", "window"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
th_ffmpeg_sys = { path = "ffmpeg-sys" }
th_media = { path = "media" }
th_playlist = { path = "playlist" }
th_pipe = { path = "pipe" }
th_edit = { path = "edit" }
th_cleanup = { path = "cleanup" }
th_window = { path = "window" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-house UI framework (wgpu + winit). Pinned by revision: Primer is not
# published to a registry. Without its default `os` feature (native menus
# and tray icons): on Linux that feature links GTK and libxdo, which artists'
# machines would then need installed. cinedex/Cargo.toml turns it on for
# macOS only, where the editor's menu is the global menu bar.
primer = { git = "http://10.100.36.15:3000/soren-n/primer.git", rev = "10fdf59fa95ff5a291798270383ce231a6253b1b", default-features = false }
exr = "1.74"
half = { version = "2", features = ["bytemuck"] }
thiserror = "2"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytemuck = { version = "1", features = ["derive"] }
# Real OpenColorIO, built from its vendored source (`bundled`).
ocio-rs = { version = "=0.3.0", features = ["bundled"] }
# A live playblast's JPG frames. Already in the tree (through primer's
# `image`); the media crate decodes with it directly.
zune-jpeg = "0.5"
# Writing JPGs in the media tests.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Graphics and decoding are unusably slow unoptimized, even in a debug build.
[profile.dev.package."*"]
opt-level = 3
