[package]
name = "th_resolver_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Resolution core for TumblePipe's entity:// USD asset resolver"
license = "Apache-2.0"
publish = false

[lib]
name = "th_resolver_core"
crate-type = ["staticlib", "rlib"]

[profile.release]
lto = "thin"
codegen-units = 1
# No `panic = "abort"`: the staticlib lives inside Houdini, and every C ABI
# entry point catches panics (lib.rs `ffi_guard`) and reports them as an
# error code. Abort would turn any core bug into a Houdini crash.
strip = "symbols"

[dev-dependencies]
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
