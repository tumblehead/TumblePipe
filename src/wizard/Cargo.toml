# Workspace for the TumblePipe native apps that TumbleTrove Desktop invokes as
# package hooks. One shared core, one binary per hook — deliberately separate
# apps rather than modes of one binary, because the hooks are separate concerns:
# `tt_setup` sets a project up, `tt_prepare` brings its `_config` forward.
#
# The core carries every rule both need (validation, the template scaffold, the
# config-DB edits and the migrations) and links no GUI, so it stays unit-testable
# for byte-for-byte JSON parity without spinning up a window.
[workspace]
resolver = "2"
members = ["core", "tt_setup", "tt_prepare"]

# Mirror src/resolver: small, fast, panic=abort release binaries. Profiles are
# workspace-wide — cargo ignores a [profile] table in a member manifest.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
