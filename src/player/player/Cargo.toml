[package]
name = "th_player"
description = "The TumblePipe sequence player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "th_player"
path = "src/main.rs"

[features]
default = ["ocio"]
# The display transform for EXRs. Builds OpenColorIO from source (CMake and
# a C++ compiler), linked statically. Without it EXRs show as linear sRGB.
ocio = ["dep:ocio-rs"]

[dependencies]
th_media.workspace = true
primer.workspace = true
bytemuck.workspace = true
half.workspace = true
futures = "0.3"
th_playlist.workspace = true
ocio-rs = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
