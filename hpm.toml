# Rationale for the non-obvious entries below: docs/development.md,
# "The package manifest".

[package]
path = "tumblehead/tumblepipe"
name = "TumblePipe"
version = "1.83.0"
description = "A small studio pipeline for animation and VFX projects in Houdini"
readme = "README.md"
documentation = "https://tumblepipe.readthedocs.io"
keywords = ["houdini"]

[compat]
# The upper bound is EXCLUSIVE (the first unsupported major). Raise it only
# together with HPM_HOUDINI_MAJORS in .woodpecker/build-*.yml, which builds
# the per-major resolver and VRAM hook the package loads.
houdini = ">=22, <23"
# One archive per platform; each CI worker builds and packs its own natively.
platforms = ["windows-x86_64", "linux-x86_64", "macos-aarch64"]

[runtime]
TH_PIPELINE_PATH = { method = "set", value = "$HPM_PACKAGE_ROOT" }
# The importable `tumblepipe` package, in Houdini, hython and farm tasks alike.
# python3.13libs/ is found through the package root on HOUDINI_PATH; python/
# is not.
PYTHONPATH = { method = "prepend", value = "$HPM_PACKAGE_ROOT/python" }
# Required placeholder, deliberately with NO `value`: the consuming project
# must supply it (tt_setup's Configure emits it), and an install without it
# fails rather than launching with rootless /_config, /export, /library paths.
# The farm's synthetic job manifest (tumblepipe.farm.deadline) satisfies it
# too; keep the two in step.
TH_PROJECT_PATH = { method = "set", required = true }
TH_CONFIG_PATH = { method = "set", value = "$TH_PROJECT_PATH/_config" }
TH_EXPORT_PATH = { method = "set", value = "$TH_PROJECT_PATH/export" }
# Pipeline user = the TumbleTrove account. $TT_USER_NAME passes through hpm and
# is expanded by Houdini from the Desktop launcher's environment; outside a
# Desktop launch it is blank, deliberately with no OS-username fallback. The
# Python side reads TH_USER only.
TH_USER = { method = "set", value = "$TT_USER_NAME" }
# TumbleTrove's asset-browser downloads land project-local, under
# <project>/library/<catalog>.
TT_DOWNLOADS_PATH = { method = "set", value = "$TH_PROJECT_PATH/library" }
# The color config belongs to the project (scaffolded from
# scripts/project_template/_config/ocio/), not to the package.
OCIO = { method = "set", value = "$TH_CONFIG_PATH/ocio/tumblehead.ocio" }
# tumbleResolver registration. Package env edits apply before USD's plugin
# registry first scans, which is the only in-process timing that works.
# $HOUDINI_MAJOR_RELEASE passes through hpm and is expanded by Houdini, so
# each Houdini picks its own resolver/houdini<major>/. The library-path
# entries serve child processes (husk, hython, farm tasks); in-process
# loading relies on the resolver's rpath.
PXR_PLUGINPATH_NAME = { method = "prepend", value = "$HPM_PACKAGE_ROOT/resolver/houdini$HOUDINI_MAJOR_RELEASE/tumbleResolver/resources" }
PATH = { method = "prepend", value = "$HPM_PACKAGE_ROOT/resolver/houdini$HOUDINI_MAJOR_RELEASE/tumbleResolver/lib" }
LD_LIBRARY_PATH = { method = "prepend", value = "$HPM_PACKAGE_ROOT/resolver/houdini$HOUDINI_MAJOR_RELEASE/tumbleResolver/lib" }
DYLD_LIBRARY_PATH = { method = "prepend", value = "$HPM_PACKAGE_ROOT/resolver/houdini$HOUDINI_MAJOR_RELEASE/tumbleResolver/lib" }
# The VRAM Inspector's viewport hook. An HDK DSO must match the Houdini
# major.minor it loads into, hence dso/<major>.<minor>/.
HOUDINI_DSO_PATH = { method = "prepend", value = "$HPM_PACKAGE_ROOT/dso/$HOUDINI_MAJOR_RELEASE.$HOUDINI_MINOR_RELEASE" }

# The asset browser catalog, documentation, workfile context and package menu
# are TumbleTrove's SDK; the network menus are Radial's. TumblePipe calls both
# directly, so it requires the versions whose API it is written against.
[dependencies]
"tumbletrove/tumbletrove" = ">=0.48"
"tumbletrove/radial" = ">=0.8"

[python_dependencies]
dictdiffer = ">=0.9.0"
# Writes the farm-job hpm.toml manifest (tumblepipe.farm.deadline).
tomli-w = ">=1.0"

[stage]
# Build the artifacts the archive ships, before staging. Only `hpm build` (and
# `hpm run <script>`) runs these; `hpm pack` does not. The outputs are
# gitignored, so .hpmignore re-includes them.
#   build-resolver — tumbleResolver USD plugin -> resolver/houdini<major>/
#   build-wizard   — tt_setup + tt_prepare hook apps -> bin/<platform>/
#   build-vramhook — VRAM Inspector hook DSO -> dso/<major>.<minor>/
#   compile-hdas   — expanded otls/<name>/ -> otls/<name>.hda
prepack = ["build-resolver", "build-wizard", "build-vramhook", "compile-hdas"]

# Archive contents: an allowlist. It is also the public source mirror's list,
# plus .ci/_packaging.py MIRROR_EXTRAS (src/ and repo metadata).
include = [
    "README.md",
    "CHANGELOG.md",              # docs/changelog.md links to it in the installed package
    "LICENSE",
    "hpm.toml",
    # The user documentation, rendered offline by TumbleTrove ▸ Documentation
    # (docs/index.md is the front page and sidebar).
    "docs/**",
    "radial_menus/**",
    # Stock department radials: TumbleTrove's lowest radial layer. Not under
    # radial_menus/, which is read as the package layer.
    "stock/**",
    "otls/**",
    "python/tumblepipe/**",
    "python3.13libs/**",
    "desktop/TumblePipe.desk",
    "scripts/**",
    "resources/**",
    # Built native artifacts (prepack); their sources under src/ do not ship.
    "resolver/**",
    "bin/**",
    "dso/**",
]
# Carve-outs within the included dirs.
exclude = [
    "otls/*/**",                 # expanded HDA sources — the collapsed .hda ships
    "scripts/verify_*.py",       # dev-only verification harnesses
    "docs/conf.py",              # the readthedocs (Sphinx) build, not part of the offline book
    "docs/requirements.txt",
    "docs/_static/**",
    "docs/_build/**",
    "**/__pycache__/**",         # tt_setup copies the project_template scaffold wholesale
]

# The prepack scripts. `when.os` is the only [scripts] axis, so each routes to
# its worker's platform id; the per-Houdini-major loops (resolver, VRAM hook)
# live in the scripts and follow $HPM_HOUDINI_MAJORS, which they require.
[scripts.build-resolver]
cmd = [
    { when = { os = "windows" }, set = "python .ci/build_resolver.py --platform windows-x86_64" },
    { when = { os = "linux" }, set = "python .ci/build_resolver.py --platform linux-x86_64" },
    { when = { os = "macos" }, set = "python .ci/build_resolver.py --platform macos-aarch64" },
]
python = "3.11"

[scripts.build-wizard]
cmd = [
    { when = { os = "windows" }, set = "python .ci/build_wizard.py --platform windows-x86_64" },
    { when = { os = "linux" }, set = "python .ci/build_wizard.py --platform linux-x86_64" },
    { when = { os = "macos" }, set = "python .ci/build_wizard.py --platform macos-aarch64" },
]
python = "3.11"

[scripts.build-vramhook]
cmd = [
    { when = { os = "windows" }, set = "python .ci/build_vramhook.py --platform windows-x86_64" },
    { when = { os = "linux" }, set = "python .ci/build_vramhook.py --platform linux-x86_64" },
    { when = { os = "macos" }, set = "python .ci/build_vramhook.py --platform macos-aarch64" },
]
python = "3.11"

[scripts.compile-hdas]
cmd = [
    { when = { os = "windows" }, set = "python .ci/compile_hdas.py" },
    { when = { os = "linux" }, set = "python .ci/compile_hdas.py" },
    { when = { os = "macos" }, set = "python .ci/compile_hdas.py" },
]
python = "3.11"

# Desktop hooks. Program paths are absolute ($HPM_PACKAGE_ROOT) and quoted:
# Windows resolves a relative program against the desktop app's cwd, and the
# package root can contain spaces or `@`. They run the prebuilt binaries
# directly, with no managed Python. No label: a label would list them as
# buttons in the desktop's Scripts panel.
#
# tt_setup: the Configure button — points at or scaffolds a project and emits
# {"envVars": {"TH_PROJECT_PATH": ...}}.
[scripts.tt_setup]
cmd = [
    { when = { os = "windows" }, set = "\"$HPM_PACKAGE_ROOT/bin/windows-x86_64/tt_setup.exe\" --template-dir \"$HPM_PACKAGE_ROOT/scripts/project_template\"" },
    { when = { os = "linux" }, set = "\"$HPM_PACKAGE_ROOT/bin/linux-x86_64/tt_setup\" --template-dir \"$HPM_PACKAGE_ROOT/scripts/project_template\"" },
    { when = { os = "macos" }, set = "\"$HPM_PACKAGE_ROOT/bin/macos-aarch64/tt_setup\" --template-dir \"$HPM_PACKAGE_ROOT/scripts/project_template\"" },
]

# tt_prepare: runs on every project launch (the only hook that fires after a
# package upgrade) and offers to bring the project's _config forward.
[scripts.tt_prepare]
cmd = [
    { when = { os = "windows" }, set = "\"$HPM_PACKAGE_ROOT/bin/windows-x86_64/tt_prepare.exe\" --template-dir \"$HPM_PACKAGE_ROOT/scripts/project_template\"" },
    { when = { os = "linux" }, set = "\"$HPM_PACKAGE_ROOT/bin/linux-x86_64/tt_prepare\" --template-dir \"$HPM_PACKAGE_ROOT/scripts/project_template\"" },
    { when = { os = "macos" }, set = "\"$HPM_PACKAGE_ROOT/bin/macos-aarch64/tt_prepare\" --template-dir \"$HPM_PACKAGE_ROOT/scripts/project_template\"" },
]

# Scripts-panel buttons (the label is what lists them). Desktop scripts run in
# the project dir, so the script path goes through $HPM_PACKAGE_ROOT.
#
# migrate-config: the same tt_prepare migration, on demand, for
# $TH_PROJECT_PATH. Writes a .bak first; idempotent.
[scripts.migrate-config]
cmd = "python \"$HPM_PACKAGE_ROOT/scripts/migrate_config.py\""
python = "3.11"
label = "Migrate Project Config"
description = "Bring this project's _config layout up to the current pipeline version"

# farm: the Farm Submit grid without a Houdini session. The stdlib-only
# launcher finds a matching Houdini and starts the window in its bundled
# Python.
[scripts.farm]
cmd = "python \"$HPM_PACKAGE_ROOT/scripts/farm_launcher.py\""
python = "3.11"
label = "Farm Submit"
description = "Publish, playblast and render shots on the farm, without opening Houdini"

# archive / unarchive: the project archive window (tumblepipe.archive.app),
# started the same way as Farm Submit. The same library runs headless as
# `python -m tumblepipe.archive plan|create|verify|restore`.
[scripts.archive]
cmd = "python \"$HPM_PACKAGE_ROOT/scripts/farm_launcher.py\" --app archive"
python = "3.11"
label = "Archive Project"
description = "Pack the project's workfiles and the exports they load into a zip archive, for the client or cold storage"

[scripts.unarchive]
cmd = "python \"$HPM_PACKAGE_ROOT/scripts/farm_launcher.py\" --app restore"
python = "3.11"
label = "Restore Archive"
description = "Check a TumblePipe archive and unpack it into a folder"

[scripts.rebuild-caches]
cmd = "python \"$HPM_PACKAGE_ROOT/scripts/farm_launcher.py\" --app rebuild"
python = "3.11"
label = "Rebuild Caches"
description = "In a project restored from an archive, re-make the caches the archive left out by re-running their workfiles in hython (needs a Houdini licence)"

# Operator index. Declares every HDA node type this package bundles so
# `hpm pack` can emit a searchable asset index for registry-level node
# discovery without downloading the archive. Generated from the otls/
# expanded-HDA INDEX__SECTION + Tools.shelf (.ci/gen_operators.py is the
# generator); regenerate when operators are added, removed, or retyped.
# `source` is the collapsed otls/<name>.hda that compile-hdas produces at
# pack time (Recipes.hda ships as a tracked binary). `icon` is omitted:
# hpm's icon is a Houdini icon identifier, but ours are
